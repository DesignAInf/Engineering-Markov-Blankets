[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-markov-blankets"
version = "0.9.0"
description = "Engineering Markov Blankets: when sensory states descend from active states. Reference implementation of the paper's experiments."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Luca M. Possati", email = "l.m.possati@utwente.nl" }]
keywords = ["Markov blanket", "active inference", "free energy principle",
            "Blackwell", "misspecification", "design", "expected free energy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
emb-reproduce = "emb.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
